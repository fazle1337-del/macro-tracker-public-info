# Self-hosting stack for Macro ForgeFit — PostgreSQL + API + web frontend on
# port 8069. The app images are multi-arch (linux/amd64 + linux/arm64), so this
# runs on ordinary x86-64 servers, VMs and NAS boxes as well as ARM devices
# like a Raspberry Pi. See SELF-HOSTING.md for the full walkthrough.
#
# Server mode is multi-user (issue #124): each person registers their own
# account on the server and their logged data is private to them; the food
# database is shared. The FIRST account registered becomes the household owner.
# There is no shared API key — authentication is per-user (username + password).
#
# The two secrets below have safe-to-run defaults so this works out of the box
# on a private home network. If you expose the server to the internet, override
# them — the easiest way is a `.env` file next to this one (see step 3 of
# SELF-HOSTING.md, or just run ./install.sh which writes strong random values
# for you):
#
#     POSTGRES_PASSWORD=<random>
#     APP_SEED=<random>
#
# APP_SEED signs every account's login token AND encrypts saved backup / Open
# Food Facts credentials at rest. Changing it later just logs everyone out
# (they sign in again — no data is lost).
services:
  db:
    image: postgres:16-alpine
    container_name: macro-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: macrotracker
      POSTGRES_USER: macrouser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme123}
    volumes:
      - macro-tracker-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U macrouser -d macrotracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: tonybooom/macro-tracker-api:latest
    container_name: macro-tracker-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://macrouser:${POSTGRES_PASSWORD:-changeme123}@macro-tracker-db:5432/macrotracker
      NODE_ENV: production
      APP_SEED: ${APP_SEED:-change-this-to-a-long-random-string}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: tonybooom/macro-tracker-frontend:latest
    container_name: macro-tracker-frontend
    restart: unless-stopped
    ports:
      - "8069:80"
    depends_on:
      - api

volumes:
  macro-tracker-db:
